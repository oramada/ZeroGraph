[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusionblocks-independent"
version = "0.5.1"
description = "ZeroGraph: independent block training with materialized supervision"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Alfalfa Labs, Inc."}]
keywords = ["pytorch", "distributed-training", "blockwise-learning", "diffusion", "machine-learning"]
dependencies = [
  "diffusionblocks-v5 @ https://github.com/oramada/ZeroGraph/releases/download/v0.5.0/diffusionblocks_v5-0.17.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["build>=1.3", "pytest>=9.0"]

[project.scripts]
diffusionblocks-independent = "diffusionblocks_independent.cli:main"
zerograph = "diffusionblocks_independent.cli:main"

[project.urls]
Homepage = "https://github.com/oramada/ZeroGraph"
Repository = "https://github.com/oramada/ZeroGraph"
Issues = "https://github.com/oramada/ZeroGraph/issues"
Changelog = "https://github.com/oramada/ZeroGraph/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
